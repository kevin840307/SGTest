name: Asset converter checks
on:
  push:
    paths:
      - "tools/**"
      - "requirements.txt"
      - "run_build_assets.bat"
      - ".github/workflows/asset-converter.yml"
  pull_request:
    paths:
      - "tools/**"
      - "requirements.txt"
      - "run_build_assets.bat"
      - ".github/workflows/asset-converter.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  converter:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Converter parsers and source contract
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -q
      - name: Pure Python content contracts
        run: python -m unittest discover -s tools -p 'test_*.py' -q
