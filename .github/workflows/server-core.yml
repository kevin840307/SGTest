name: SGTest Server Core
on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/server-core.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-domain-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build Server Release
        run: dotnet build server/SGTest.Host/SGTest.Host.csproj -c Release --warnaserror
      - name: Domain movement/replay tests
        run: dotnet run -c Release --project server/tests/SGTest.Domain.Specs/SGTest.Domain.Specs.csproj
