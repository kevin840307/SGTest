name: Client core checks
on:
  push:
    paths:
      - "client/**"
      - "server/src/SGTest.Server/**"
      - "server/tests/SGTest.Server.LoginFixture/**"
      - ".github/workflows/client-core.yml"
  pull_request:
    paths:
      - "client/**"
      - "server/src/SGTest.Server/**"
      - "server/tests/SGTest.Server.LoginFixture/**"
      - ".github/workflows/client-core.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/cache@v4
        id: godot-cache
        with:
          path: .cache/godot-4.7.2
          key: godot-4.7.2-linux-x86_64-cadd3204e728a35d
      - name: Download verified Godot 4.7.2
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/godot-4.7.2
          curl --fail --location --retry 3 --output /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip" | sha256sum --check
          unzip -q /tmp/godot.zip -d .cache/godot-4.7.2
          chmod +x .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64
      - name: Validate real OS process CPU/RSS telemetry sampler
        run: python -m unittest client.tests.test_process_telemetry -v
      - name: Godot wire codec
        run: .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_wire_codec.gd
      - name: Godot AOI compact wire and WorldState generation gate
        run: .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_aoi_wire.gd
      - name: Godot authoritative pickup golden and one-time item UID reducer
        run: .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_ground_pickup_wire.gd
      - name: Godot durable inventory login chunks and pickup UID merge
        run: .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_inventory_snapshot.gd
      - name: Godot Server-owned learned skill book baseline
        run: .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_skill_book_snapshot.gd
      - name: Godot verified recovery use wire, HP and one-time quantity reducer
        run: .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_recovery_use_wire.gd
      - name: Godot authoritative inventory discard wire and durable quantity reducer
        run: .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_inventory_discard_wire.gd
      - name: Godot NPC shop wire, money and inventory reducer
        run: .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_shop_wire.gd
      - name: Godot personal storage wire and authoritative UID transfer reducer
        run: .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_storage_wire.gd
      - name: Godot durable equipment UID and slot-authority reducer
        run: .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_equipment_wire.gd
      - name: Godot scoped bank authoritative balance reducer
        run: .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_bank_wire.gd
      - name: Godot server-authoritative repair durability reducer
        run: .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_repair_wire.gd
      - name: Godot server-authoritative equipment enhancement reducer
        run: .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_enhancement_wire.gd
      - name: Godot player trade wire and authoritative settlement reducer
        run: .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_trade_wire.gd
      - name: Godot player shop wire and authoritative UID wallet reducer
        run: .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_player_shop_wire.gd
      - name: Godot nearby chat trusted delivery and replay reducer
        run: .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_chat_wire.gd
      - name: Godot server-authoritative party membership and cross-map chat reducer
        run: .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_party_wire.gd
      - name: Godot verified quest wire contract
        run: .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_quest_wire.gd
      - name: Godot authenticated PvP mode query, replay and map generation reducer
        run: .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_pvp_mode_wire.gd
      - name: Godot authenticated online GM PvP-name capability and reducer
        run: .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_gm_pvp_wire.gd
      - name: Godot authoritative player PvP attack and shared damage reducer
        run: .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_pvp_attack_wire.gd
      - name: Godot trusted player identity and PvP name-state reducer
        run: .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_pvp_identity_wire.gd
      - name: Godot private item name catalog and fail-closed provenance
        run: .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_item_catalog.gd
      - name: Godot audited NPC portal compact wire and reducer gate
        run: .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_npc_portal_wire.gd
      - name: Godot trusted normal attack wire and reducer gate
        run: .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_normal_attack_wire.gd
      - name: Godot verified single-target skill wire and reducer gate
        run: .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_skill_combat_wire.gd
      - name: ClientSession server-authoritative out-of-range auto approach attack
        run: .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_client_auto_approach_attack.gd
      - name: Recovered-compatible 1000ms cursor-follow autorun policy
        run: .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_mouse_autorun_state.gd
      - name: ClientSession ordered movement stop barrier
        run: .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_client_stop_barrier.gd
      - name: Godot durable player damage wire and death reducer gate
        run: .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_player_damage_wire.gd
      - name: Godot bounded transport compile gate
        run: .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_client_transport.gd
      - name: Godot WorldState generation gate
        run: .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_world_state.gd
      - name: Render-FPS independent reducer gate
        run: timeout 20s .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_client_fps_independence.gd
      - name: ClientSession automatic WorldReady ACK and AOI resync recovery
        run: .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_client_resync.gd
      - name: Server-tick bounded player interpolation selection
        run: .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_position_history.gd
      - name: PvP player name color deadline and flashing presentation
        run: .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_pvp_name_presentation.gd
      - name: Normalized player paper doll and atomic actor draw order
        shell: bash
        run: |
          set -euo pipefail
          .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_player_presentation.gd 2>&1 | tee /tmp/sgtest-player-presentation.log
          grep -q '^PLAYER_PRESENTATION_PASS ' /tmp/sgtest-player-presentation.log
          ! grep -E 'ERROR:|SCRIPT ERROR:|leaked|still in use' /tmp/sgtest-player-presentation.log
      - name: Verified monster visual presentation and common world draw order
        shell: bash
        run: |
          set -euo pipefail
          .cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_monster_presentation.gd 2>&1 | tee /tmp/sgtest-monster-presentation.log
          grep -q '^MONSTER_PRESENTATION_PASS ' /tmp/sgtest-monster-presentation.log
          ! grep -E 'ERROR:|SCRIPT ERROR:|leaked|still in use' /tmp/sgtest-monster-presentation.log
      - name: Real Godot to CSharp secure TLS login E2E
        run: python client/tests/run_tls_login.py "$PWD/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64"
      - name: Real Godot opt-in public registration then normal Auth over TLS
        run: python client/tests/run_tls_login.py "$PWD/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64" --register --timeout 35
      - name: Real Godot ClientSession inventory discard over TLS
        run: python client/tests/run_tls_login.py "$PWD/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64" --discard --timeout 45
      - name: Real Godot ClientSession personal storage over TLS
        run: python client/tests/run_tls_login.py "$PWD/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64" --storage --timeout 45
      - name: Real Godot ClientSession durable equipment over TLS
        run: python client/tests/run_tls_login.py "$PWD/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64" --equipment --timeout 45
      - name: Real Godot ClientSession scoped bank over TLS
        run: python client/tests/run_tls_login.py "$PWD/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64" --bank --timeout 45
      - name: Real Godot ClientSession server-authoritative repair over TLS
        run: python client/tests/run_tls_login.py "$PWD/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64" --repair --timeout 45
      - name: Real Godot ClientSession server-authoritative enhancement over TLS
        run: python client/tests/run_tls_login.py "$PWD/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64" --enhancement --timeout 45
      - name: Real Godot verified Quest progression and relogin over TLS
        run: python client/tests/run_tls_login.py "$PWD/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64" --quest --timeout 55
      - name: Two real Godot ClientSessions durable player trade over TLS
        run: python client/tests/run_tls_login.py "$PWD/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64" --trade --timeout 55
      - name: Two real Godot ClientSessions authoritative player shop over TLS
        run: python client/tests/run_tls_login.py "$PWD/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64" --player-shop --timeout 55
      - name: Two real Godot ClientSessions authoritative player PvP over TLS
        run: python client/tests/run_tls_login.py "$PWD/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64" --pvp --timeout 55
      - name: Real Godot ClientSession out-of-range auto approach attack over TLS
        run: python client/tests/run_tls_login.py "$PWD/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64" --auto-attack --timeout 45
      - name: Real Godot ClientSession trusted normal attack over TLS
        run: python client/tests/run_tls_login.py "$PWD/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64" --combat --timeout 45
      - name: Real Godot ClientSession self-centered AoE skill over TLS
        run: python client/tests/run_tls_login.py "$PWD/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64" --skill-aoe --timeout 45
      - name: Two real Godot Clients multi-target AoE visual E2E
        run: python client/tests/run_tls_login.py "$PWD/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64" --skill-aoe-observer --timeout 50
      - name: Two real Godot Clients authoritative player attack visual E2E
        run: python client/tests/run_tls_login.py "$PWD/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64" --combat-observer --timeout 50
      - name: Forced TLS disconnect automatic same-character reconnect E2E
        run: python client/tests/run_tls_login.py "$PWD/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64" --reconnect --timeout 55
      - name: Real application login selection and logout UI over TLS
        run: python client/tests/run_tls_login.py "$PWD/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64" --app-ui
      - name: Two concurrent Godot Clients TLS player AOI E2E
        run: python client/tests/run_tls_login.py "$PWD/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64" --multi --timeout 50
      - name: Two Godot Clients trusted Map15 Map13 Map15 AOI transfer E2E
        run: python client/tests/run_tls_login.py "$PWD/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64" --crossmap --timeout 70
      - name: Two Godot Clients audited NPC portal action E2E
        run: python client/tests/run_tls_login.py "$PWD/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64" --portal --timeout 70
      - name: Formal Host plus two actual main-scene Godot clients
        run: python client/tests/run_online_main_gate.py "$PWD/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64" --timeout 70 --metrics-report "$RUNNER_TEMP/sgtest_online_main_process_metrics.json"
      - name: Archive headless main-scene resource baseline (not Windows gameplay)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: online-main-process-baseline
          path: ${{ runner.temp }}/sgtest_online_main_process_metrics.json
          retention-days: 14
          if-no-files-found: warn
