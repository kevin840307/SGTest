name: Legacy asset inventory tools
on:
  push:
    paths:
      - 'tools/*.py'
      - 'tools/tests/**'
      - 'tools/requirements.txt'
      - '.github/workflows/legacy-asset-tools.yml'
  pull_request:
    paths:
      - 'tools/*.py'
      - 'tools/tests/**'
      - 'tools/requirements.txt'
      - '.github/workflows/legacy-asset-tools.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install asset tool dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Inventory regression tests (synthetic fixtures only)
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v
