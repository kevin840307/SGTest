syntax = "proto3";

option csharp_namespace = "SGTest.WireProbe.Proto";
package sgtest.wireprobe;

message MovePayload {
  int32 entity_id = 1;
  sint32 x = 2;
  sint32 y = 3;
  uint32 server_tick = 4;
  uint32 facing = 5;
  uint32 flags = 6;
  uint32 map_epoch = 7;
  uint32 revision = 8;
}

message CombatPayload {
  int32 source_id = 1;
  int32 target_id = 2;
  uint32 skill_id = 3;
  uint32 server_tick = 4;
  sint32 damage = 5;
  uint32 outcome = 6;
  uint32 action_sequence = 7;
  uint32 target_revision = 8;
}

message DropPayload {
  int32 drop_id = 1;
  uint32 item_definition_id = 2;
  uint32 quantity = 3;
  sint32 x = 4;
  sint32 y = 5;
  uint32 map_epoch = 6;
  uint32 revision = 7;
  int32 owner_id = 8;
}

message SpawnPayload {
  int32 entity_id = 1;
  uint32 entity_kind = 2;
  sint32 x = 3;
  sint32 y = 4;
  uint32 hp = 5;
  uint32 max_hp = 6;
  uint32 facing = 7;
  uint32 map_epoch = 8;
  uint32 revision = 9;
  uint32 action = 10;
  uint32 action_sequence = 11;
}
